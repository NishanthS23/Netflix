name: Deploy Netflix Clone to AWS EC2

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '315922735623-r9kc8d4jaau51e52up31vgg2e2ehq5g4.apps.googleusercontent.com' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize Secrets & Generate Production Env
        run: |
          clean_str() {
            printf '%s' "$1" | tr -d '\r\n'
          }
          clean_token() {
            printf '%s' "$1" | tr -d '\r\n '
          }

          CLEAN_USER=$(clean_token "${{ secrets.EC2_USER }}")
          CLEAN_HOST=$(clean_token "${{ secrets.EC2_HOST }}")
          echo "EC2_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "EC2_HOST=$CLEAN_HOST" >> $GITHUB_ENV

          CLEAN_JWT=$(clean_str "${{ secrets.JWT_SECRET }}")
          CLEAN_DB_USER=$(clean_token "${{ secrets.DB_USER }}")
          CLEAN_DB_PASS=$(clean_str "${{ secrets.DB_PASSWORD }}")
          CLEAN_DB_HOST=$(clean_token "${{ secrets.DB_HOST }}")
          CLEAN_DB_NAME=$(clean_token "${{ secrets.DB_NAME }}")
          CLEAN_TMDB=$(clean_token "${{ secrets.TMDB_API_KEY }}")
          CLEAN_DH_USER=$(clean_token "${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}")
          CLEAN_DB_URL=$(clean_str "${{ secrets.DATABASE_URL }}")
          CLEAN_DH_TOKEN=$(clean_token "${{ secrets.DOCKERHUB_TOKEN }}")

          CLEAN_SMTP_HOST=$(clean_token "${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}")
          CLEAN_SMTP_PORT=$(clean_token "${{ secrets.SMTP_PORT || '587' }}")
          CLEAN_SMTP_SECURE=$(clean_token "${{ secrets.SMTP_SECURE || 'false' }}")
          CLEAN_SMTP_USER=$(clean_token "${{ secrets.SMTP_USER || 'zxeoncyber1@gmail.com' }}")
          CLEAN_SMTP_PASS=$(clean_str "${{ secrets.SMTP_PASS || 'gvjimmuwjjuvpfpe' }}")
          CLEAN_EMAIL_FROM=$(clean_str "${{ secrets.EMAIL_FROM || 'Netflix Clone <zxeoncyber1@gmail.com>' }}")
          CLEAN_GOOGLE_CLIENT_ID=$(clean_token "${{ secrets.GOOGLE_CLIENT_ID || '315922735623-r9kc8d4jaau51e52up31vgg2e2ehq5g4.apps.googleusercontent.com' }}")

          if [ -n "${CLEAN_DB_URL}" ]; then
            DATABASE_URL="${CLEAN_DB_URL}"
          elif [ -n "${CLEAN_DB_USER}" ] && [ -n "${CLEAN_DB_HOST}" ]; then
            DATABASE_URL="postgresql://${CLEAN_DB_USER}:${CLEAN_DB_PASS}@${CLEAN_DB_HOST}:5432/${CLEAN_DB_NAME}?sslmode=require"
          else
            DATABASE_URL=""
          fi

          {
            echo "NODE_ENV=production"
            echo "SERVER_PORT=8000"
            echo "CLIENT_URL=http://${CLEAN_HOST}"
            echo "JWT_SECRET=${CLEAN_JWT}"
            echo "DB_HOST=${CLEAN_DB_HOST}"
            echo "DB_PORT=5432"
            echo "DB_USER=${CLEAN_DB_USER}"
            echo "DB_PASSWORD=${CLEAN_DB_PASS}"
            echo "DB_NAME=${CLEAN_DB_NAME}"
            echo "DB_SSL=true"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "TMDB_API_KEY=${CLEAN_TMDB}"
            echo "SMTP_HOST=${CLEAN_SMTP_HOST}"
            echo "SMTP_PORT=${CLEAN_SMTP_PORT}"
            echo "SMTP_SECURE=${CLEAN_SMTP_SECURE}"
            echo "SMTP_USER=${CLEAN_SMTP_USER}"
            echo "SMTP_PASS=${CLEAN_SMTP_PASS}"
            echo "EMAIL_FROM=\"${CLEAN_EMAIL_FROM}\""
            echo "GOOGLE_CLIENT_ID=${CLEAN_GOOGLE_CLIENT_ID}"
            echo "VITE_GOOGLE_CLIENT_ID=${CLEAN_GOOGLE_CLIENT_ID}"
            echo "DOCKERHUB_USERNAME=${CLEAN_DH_USER}"
          } > .env.temp

          ENV_B64=$(base64 .env.temp | tr -d '\r\n')
          echo "ENV_B64=$ENV_B64" >> $GITHUB_ENV
          echo "CLEAN_DH_USER=$CLEAN_DH_USER" >> $GITHUB_ENV
          echo "CLEAN_DH_TOKEN=$CLEAN_DH_TOKEN" >> $GITHUB_ENV
          rm -f .env.temp

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 180s
          script_stop: true
          script: |
            set -e

            echo "=== 1. Checking project directory ==="
            PROJECT_DIR="$HOME/netflix-clone"
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/NishanthS23/Netflix.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"

            echo "=== 2. Pulling latest repository configuration ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== 3. Writing .env file ==="
            echo "${{ env.ENV_B64 }}" | base64 -d > .env
            chmod 600 .env
            echo "Generated .env successfully for ${{ env.EC2_HOST }} without exposing secrets"

            echo "=== 4. Pulling Pre-built Images from Docker Hub ==="
            if [ -n "${{ env.CLEAN_DH_TOKEN }}" ]; then
              echo "${{ env.CLEAN_DH_TOKEN }}" | docker login -u "${{ env.CLEAN_DH_USER }}" --password-stdin
            fi
            docker compose --env-file .env pull

            echo "=== 5. Starting Application with Docker Compose ==="
            docker rm -f netflix-frontend netflix-backend netflix-db 2>/dev/null || true
            docker compose --env-file .env up -d --remove-orphans

            echo "=== 6. Running Health Check (via Nginx Port 80) ==="
            chmod +x scripts/healthcheck.sh
            bash scripts/healthcheck.sh

            echo "=== 7. Cleanup dangling & old images ==="
            docker image prune -af || true

            echo "=== Netflix Clone deployed successfully! ==="
