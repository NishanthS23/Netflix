name: Deploy Netflix Clone to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize Secrets
        run: |
          CLEAN_USER=$(echo "${{ secrets.EC2_USER }}" | tr -d '\r\n ')
          CLEAN_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '\r\n ')
          echo "EC2_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "EC2_HOST=$CLEAN_HOST" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script_stop: true
          script: |
            set -e

            echo "=== 1. Checking project directory ==="
            PROJECT_DIR="$HOME/netflix-clone"
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/NishanthS23/Netflix.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"

            echo "=== 2. Pulling latest changes from main ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== 3. Writing .env file ==="
            cat << 'EOF' > .env
            NODE_ENV=production
            SERVER_PORT=8000
            MONGO_URI=mongodb://db:27017/netflix
            CLIENT_URL=http://${{ env.EC2_HOST }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            MAILTRAP_TOKEN=${{ secrets.MAILTRAP_TOKEN }}
            MAILTRAP_ENDPOINT=${{ secrets.MAILTRAP_ENDPOINT }}
            EOF

            echo "=== 4. Starting Docker Compose build and deployment ==="
            docker rm -f netflix-frontend netflix-backend netflix-db 2>/dev/null || true
            docker compose --env-file .env up -d --build --remove-orphans

            echo "=== 5. Running Health Check ==="
            chmod +x scripts/healthcheck.sh
            bash scripts/healthcheck.sh

            echo "=== 6. Cleanup dangling images ==="
            docker image prune -f || true

            echo "=== Netflix Clone deployed successfully! ==="
