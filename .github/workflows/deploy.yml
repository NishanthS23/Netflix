name: Deploy Netflix Clone to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}/netflix-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize Secrets
        run: |
          CLEAN_USER=$(echo "${{ secrets.EC2_USER }}" | tr -d '\r\n ')
          CLEAN_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '\r\n ')
          echo "EC2_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "EC2_HOST=$CLEAN_HOST" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 180s
          script_stop: true
          script: |
            set -e

            echo "=== 1. Checking project directory ==="
            PROJECT_DIR="$HOME/netflix-clone"
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/NishanthS23/Netflix.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"

            echo "=== 2. Pulling latest repository configuration ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== 3. Writing .env file ==="
            chmod +x scripts/create_env.sh
            bash scripts/create_env.sh "${{ env.EC2_HOST }}" "${{ secrets.JWT_SECRET }}" "${{ secrets.DB_USER }}" "${{ secrets.DB_PASSWORD }}" "${{ secrets.DB_HOST }}" "${{ secrets.DB_NAME }}" "${{ secrets.TMDB_API_KEY }}" "${{ secrets.MAILTRAP_TOKEN }}" "${{ secrets.MAILTRAP_ENDPOINT }}" "${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}" "${{ secrets.DATABASE_URL }}"

            echo "=== 4. Pulling Pre-built Images from Docker Hub ==="
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME || 'nishanthsaravanan503' }}" --password-stdin
            fi
            docker compose --env-file .env pull

            echo "=== 5. Starting Application with Docker Compose ==="
            docker rm -f netflix-frontend netflix-backend netflix-db 2>/dev/null || true
            docker compose --env-file .env up -d --remove-orphans

            echo "=== 6. Running Health Check (via Nginx Port 80) ==="
            chmod +x scripts/healthcheck.sh
            bash scripts/healthcheck.sh

            echo "=== 7. Cleanup dangling & old images ==="
            docker image prune -af || true

            echo "=== Netflix Clone deployed successfully! ==="
