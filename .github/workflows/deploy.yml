name: Deploy Netflix Clone to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize Secrets
        run: |
          CLEAN_USER=$(echo "${{ secrets.EC2_USER }}" | tr -d '\r\n ')
          CLEAN_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '\r\n ')
          echo "EC2_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "EC2_HOST=$CLEAN_HOST" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script_stop: true
          script: |
            set -e

            echo "=== 1. Checking project directory ==="
            PROJECT_DIR="$HOME/netflix-clone"
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/NishanthS23/Netflix.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"

            echo "=== 2. Pulling latest changes from main ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== 3. Writing .env file ==="
            cat << 'EOF' > .env
            NODE_ENV=production
            SERVER_PORT=8000
            MONGO_URI=mongodb://db:27017/netflix
            CLIENT_URL=http://${{ env.EC2_HOST }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            MAILTRAP_TOKEN=${{ secrets.MAILTRAP_TOKEN }}
            MAILTRAP_ENDPOINT=${{ secrets.MAILTRAP_ENDPOINT }}
            EOF

            echo "=== 4. Starting Docker Compose build and deployment ==="
            docker compose --env-file .env up -d --build --remove-orphans

            echo "=== 5. Verifying All Three Containers Are Running ==="
            sleep 15

            REQUIRED_CONTAINERS=("netflix-frontend" "netflix-backend" "netflix-db")
            ALL_OK=true

            echo "--- Container Status Checks ---"
            for c in "${REQUIRED_CONTAINERS[@]}"; do
              STATUS=$(docker inspect --format '{{.State.Status}}' "$c" 2>/dev/null || echo "not_found")
              HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" 2>/dev/null || echo "none")

              if [ "$STATUS" = "running" ]; then
                if [ "$HEALTH" = "unhealthy" ]; then
                  echo "❌ Container $c is RUNNING but UNHEALTHY"
                  ALL_OK=false
                elif [ "$HEALTH" = "healthy" ]; then
                  echo "✅ Container $c is RUNNING and HEALTHY"
                else
                  echo "✅ Container $c is RUNNING"
                fi
              else
                echo "❌ Container $c is NOT RUNNING (Status: $STATUS)"
                echo "--- Logs for $c ---"
                docker logs "$c" --tail 25 || true
                ALL_OK=false
              fi
            done

            echo "--- HTTP Port 80 Check ---"
            if curl -fs http://localhost:80 > /dev/null; then
              echo "✅ Frontend HTTP check passed (Port 80 responding)"
            else
              echo "❌ Frontend HTTP check failed (Port 80)"
              ALL_OK=false
            fi

            if [ "$ALL_OK" = false ]; then
              echo "❌ Health check failed! One or more containers are down or unhealthy."
              docker ps -a
              exit 1
            fi

            echo "🎉 Health Check Passed: All 3 containers are active and operational!"

            echo "=== 6. Cleanup dangling images ==="
            docker image prune -f || true

            echo "=== Netflix Clone deployed successfully! ==="
