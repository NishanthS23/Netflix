services:
  # Backend Service (Node.js & Express connected to AWS RDS PostgreSQL)
  backend:
    image: ${DOCKERHUB_USERNAME:-nishanthsaravanan503}/netflix-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netflix-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - video_uploads:/app/uploads
    networks:
      - netflix-network

  # Frontend Service (React + Vite served via Nginx)
  frontend:
    image: ${DOCKERHUB_USERNAME:-nishanthsaravanan503}/netflix-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netflix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - netflix-network

volumes:
  video_uploads:
    name: devops_video_uploads

networks:
  netflix-network:
    driver: bridge
